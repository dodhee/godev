# Decap CMS Configuration for GoDev
backend:
  name: git-gateway
  branch: master

# Publish mode - simple untuk langsung publish
publish_mode: simple

# Media files configuration
media_folder: "public/images/blog"
public_folder: "/images/blog"

# Collections - Content types
collections:
  # Blog Articles
  - name: "blog"
    label: "Blog Articles"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "Judul artikel (maks 60 karakter untuk SEO)" }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "Ringkasan artikel (150-160 karakter)", required: false }
      - { label: "Category", name: "category", widget: "select", options: ["Tips & Tutorial", "Studi Kasus", "Panduan", "Berita"], default: "Tips & Tutorial" }
      - { label: "Tags", name: "tags", widget: "list", hint: "Pisahkan dengan enter", required: false }
      - { label: "Publish Date", name: "publishDate", widget: "datetime", format: "YYYY-MM-DD", hint: "Tanggal publikasi" }
      - { label: "Author", name: "author", widget: "string", default: "Tim GoDev", required: false }
      - { label: "Featured Image", name: "image", widget: "image", required: false, hint: "Gambar utama artikel (ideal: 1200x630px)" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false, hint: "Centang jika artikel masih draft" }
      - { label: "Body", name: "body", widget: "markdown", hint: "Konten artikel - gunakan toolbar untuk format" }